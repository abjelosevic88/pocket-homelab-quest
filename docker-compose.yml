# Pocket Quest (Go + SQLite) — run tabletop role-playing games (5E): character sheets, campaigns, game nights, encounters and the initiative tracker, dice, and the SRD built in. One container, one volume.
services:
  pocket-quest:
    image: ghcr.io/abjelosevic88/pocket-homelab-quest:latest
    container_name: pocket-quest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NOTIFY_URL: ${NOTIFY_URL:-}
      # Pocket Core: one sign-in, Pocket AI, and game nights on Pocket Calendar, recaps in Pocket Notes, the party's Pocket Chat and prep in Pocket Tasks through app links.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
